name: Publish to Comfy registry
on:
  workflow_dispatch:
  push:
    # dev is the single trunk (§ branch model). Publishing fires when the
    # pyproject.toml version bump lands on dev — i.e. when release-please's
    # release PR is merged. The Comfy publish action reads the version from
    # pyproject.toml, so no tag is involved.
    branches:
      - dev
    paths:
      - "pyproject.toml"

permissions:
  issues: write

jobs:
  publish-node:
    name: Publish Custom Node to registry
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'Bria-AI' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Publish Custom Node
        uses: Comfy-Org/publish-node-action@v1
        with:
          ## Add your own personal access token to your Github Repository secrets and reference it here.
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
